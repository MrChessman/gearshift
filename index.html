<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/category-chips.css">
    <link rel="stylesheet" href="css/components/build-card.css">
    <link rel="stylesheet" href="css/components/bottom-nav.css">
    <link rel="stylesheet" href="css/pages/home.css">
</head>

<body>
    <header class="page-header">
        <div class="header-content">
            <h1 class="gearshift-title">
                <a href="#/home">GearShift</a>
            </h1>

            <nav class="header-actions" aria-label="Header actions">
                <button class="icon-button" type="button" aria-label="Notifications">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>

                <button class="icon-button" type="button" aria-label="Saved cars">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                </button>

                <button class="icon-button nav-trigger" type="button" aria-label="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="page-content">
    <section aria-labelledby="categories-title">
        <h2 id="categories-title" class="category-heading">Categories</h2>
        <div class="category-chips-container" role="group" aria-label="Car categories">
            <button class="category-chip" type="button" aria-pressed="false">JDM</button>
            <button class="category-chip" type="button" aria-pressed="false">Muscle</button>
            <button class="category-chip" type="button" aria-pressed="false">Euro</button>
            <button class="category-chip" type="button" aria-pressed="false">Classics</button>
            <button class="category-chip" type="button" aria-pressed="false">Exotics/Super</button>
            <button class="category-chip" type="button" aria-pressed="false">Daily</button>
            <button class="category-chip" type="button" aria-pressed="false">4x4</button>
        </div>
    </section>

    <section id="builds-section" class="builds-section" aria-label="Builds">
        <article class="build-card">
            <div class="build-card__top">
                <span class="build-card__user">User_01</span>
                <button class="build-card__heart" type="button" aria-label="Save this build" aria-pressed="false">
                    <svg class="build-card__heart-icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                </button>
            </div>
            <img class="build-card__photo" src="assets/img/cars/skyline-r34.jpg" alt="Nissan Skyline GT-R R34 build" width="1200" height="800">
            <h3 class="build-card__title">Nissan Skyline GT-R R34</h3>
            <a class="build-card__link" href="#/build">View Build</a>
        </article>

        <article class="build-card">
            <div class="build-card__top">
                <span class="build-card__user">User_02</span>
                <button class="build-card__heart" type="button" aria-label="Save this build" aria-pressed="false">
                    <svg class="build-card__heart-icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                </button>
            </div>
            <img class="build-card__photo" src="assets/img/cars/supra-mk4.jpg" alt="Toyota Supra MK4 build" width="1200" height="800">
            <h3 class="build-card__title">Toyota Supra MK4</h3>
            <a class="build-card__link" href="#/build">View Build</a>
        </article>

        <article class="build-card">
            <div class="build-card__top">
                <span class="build-card__user">User_03</span>
                <button class="build-card__heart" type="button" aria-label="Save this build" aria-pressed="false">
                    <svg class="build-card__heart-icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                </button>
            </div>
            <img class="build-card__photo" src="assets/img/cars/mustang-gt.jpg" alt="Ford Mustang GT build" width="1200" height="800" loading="lazy">
            <h3 class="build-card__title">Ford Mustang GT</h3>
            <a class="build-card__link" href="#/build">View Build</a>
        </article>

        <article class="build-card">
            <div class="build-card__top">
                <span class="build-card__user">User_04</span>
                <button class="build-card__heart" type="button" aria-label="Save this build" aria-pressed="false">
                    <svg class="build-card__heart-icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                </button>
            </div>
            <img class="build-card__photo" src="assets/img/cars/911-gt3.jpg" alt="Porsche 911 GT3 build" width="1200" height="800" loading="lazy">
            <h3 class="build-card__title">Porsche 911 GT3</h3>
            <a class="build-card__link" href="#/build">View Build</a>
        </article>

        <article class="build-card">
            <div class="build-card__top">
                <span class="build-card__user">User_05</span>
                <button class="build-card__heart" type="button" aria-label="Save this build" aria-pressed="false">
                    <svg class="build-card__heart-icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                </button>
            </div>
            <img class="build-card__photo" src="assets/img/cars/rx7-fd.jpg" alt="Mazda RX-7 FD build" width="1200" height="800" loading="lazy">
            <h3 class="build-card__title">Mazda RX-7 FD</h3>
            <a class="build-card__link" href="#/build">View Build</a>
        </article>

        <article class="build-card">
            <div class="build-card__top">
                <span class="build-card__user">User_06</span>
                <button class="build-card__heart" type="button" aria-label="Save this build" aria-pressed="false">
                    <svg class="build-card__heart-icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                </button>
            </div>
            <img class="build-card__photo" src="assets/img/cars/camaro-ss.jpg" alt="Chevrolet Camaro SS build" width="1200" height="800" loading="lazy">
            <h3 class="build-card__title">Chevrolet Camaro SS</h3>
            <a class="build-card__link" href="#/build">View Build</a>
        </article>
    </section>
</main>

    <nav class="bottom-nav" aria-label="Primary">
        <div class="bottom-nav__items">
            <a class="bottom-nav__item" href="#/home" aria-current="page">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 21V9l9-6 9 6v12"></path>
                    <path d="M7 21v-9h10v9"></path>
                    <path d="M7 16h10"></path>
                </svg>
                <span class="bottom-nav__label">Garage</span>
            </a>

            <a class="bottom-nav__item" href="#/search">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span class="bottom-nav__label">Search</span>
            </a>

            <a class="bottom-nav__item" href="#/post">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span class="bottom-nav__label">Add</span>
            </a>

            <a class="bottom-nav__item" href="#/dealership">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 10l2-6h14l2 6"></path>
                    <path d="M4 10v10h16V10"></path>
                    <path d="M10 20v-6h4v6"></path>
                </svg>
                <span class="bottom-nav__label">Dealership</span>
            </a>

            <a class="bottom-nav__item" href="#/profile">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M5 21v-1a7 7 0 0 1 14 0v1"></path>
                </svg>
                <span class="bottom-nav__label">Profile</span>
            </a>
        </div>
    </nav>

    <footer class="page-footer">
        <!-- Footer content -->
    </footer>
</body>

</html>
