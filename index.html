<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearShift</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/category-chips.css">
    <link rel="stylesheet" href="css/components/build-card.css">
    <link rel="stylesheet" href="css/components/bottom-nav.css">
    <link rel="stylesheet" href="css/pages/home.css">

<body>
    <header class="page-header">
        <div class="header-content">
            <h1 class="gearshift-title">
                <a href="#/home">GearShift</a>
            </h1>

            <nav class="header-actions" aria-label="Header actions">
                <button class="icon-button" type="button" aria-label="Notifications">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>

                <button class="icon-button" type="button" aria-label="Saved cars">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3"></path>
                        <path d="M14 20-.5 8.5a7.5 7.5 0 1 1 15 0v1.5z"></path>
                    </svg>
                </button>

                <button class="icon-button nav-trigger" type="button" aria-label="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <!-- Content goes here -->
    </main>

    <footer class="page-footer">
        <!-- Footer content -->
    </footer>
